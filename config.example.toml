# ~/.config/flandre/config.toml  (every key is optional; `flandre settings` edits it with a preview)

# Material scheme: tonal-spot | vibrant | expressive | fruit-salad | rainbow | neutral | monochrome | fidelity | content
variant = "fruit-salad"

# How far the wallpaper hue is pushed into neutral surfaces: soft | normal | strong
tint = "strong"

# Dark mode only: 0.0 = Material's own tones, 1.0 = near black
darken = 0.5

# Window decoration (headerbar): 0.0 = Adwaita's, a notch lighter than the window; 1.0 = near black
# in dark mode, a dim grey in light mode
headerbar = 0.0

# Shell command run after every apply. FLANDRE_PRIMARY and FLANDRE_MODE are in its environment.
extra_command = ""

# Desktop notification after each regeneration
notify = true

[targets]
gtk = true        # ~/.config/gtk-4.0/gtk.css and gtk-3.0/gtk.css (libadwaita + adw-gtk3)
shell = true      # ~/.local/share/themes/Flandre (via User Themes)
icons = true      # ~/.local/share/icons/Flandre-<family>-<hex>
ptyxis = true
console = true
blackbox = true
terminals = true  # OSC sequences to open ptys + ~/.cache/flandre/sequences

[icons]
family = "auto"               # auto | tela | papirus (auto = Tela if installed, else Papirus)
accent = "primary-container"  # primary-container | primary | secondary | tertiary | custom
tone = 45.0                   # tone for "custom" (0 black .. 100 white)
chroma = 0.0                  # minimum colourfulness; 0 keeps the scheme's own

[shell]
panel = "black"               # black | colored | transparent
panel_opacity = 1.0           # 0.0 see-through .. 1.0 solid (black and colored)
menus = 0.0                   # menu/popover background: 0.0 Adwaita greys .. 1.0 near black (dim grey in light mode)
accent = "primary"            # highlight (checked toggles, today, selections): primary-container | primary | secondary | tertiary | custom
accent_tone = 60.0            # tone for "custom" (0 black .. 100 white)

[terminals]
opacity = 1.0                 # background opacity for Ptyxis, Console and Black Box
scheme = "flandre"            # flandre | gnome | tango | solarized | monokai | gruvbox | dracula | nord
                              # | catppuccin | tokyo-night | everforest | rose-pine | ayu | kanagawa
blend = 0.5                   # classic schemes only: 0.0 as published .. 1.0 fully pulled to the wallpaper

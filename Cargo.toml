[package]
name = "flandre"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
gio = "0.22.9"
glib = "0.22.9"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_12"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jxl-oxide = { version = "0.12.6", features = ["image"] }
material-colors = { version = "0.4.2", features = ["image"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
